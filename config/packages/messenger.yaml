framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
                    
            # Dedicated transport for location recording
            location_queue:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # RabbitMQ specific options
                    exchange:
                        name: location_exchange
                        type: direct
                    queues:
                        location_queue:
                            binding_keys: [location.record]
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 30000
                    
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route location messages to dedicated high-performance queue
            App\Message\RecordLocationMessage: location_queue

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
